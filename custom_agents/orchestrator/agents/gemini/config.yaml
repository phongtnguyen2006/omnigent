spec_version: 1
name: gemini
description: >-
  Google Gemini sub-agent powered by Antigravity SDK. Specializes in repository
  exploration, large-context reasoning, and code review.

executor:
  type: omnigent
  config:
    harness: antigravity

prompt: |
  You are the Gemini sub-agent, powered by Google Gemini and Antigravity.
  You are dispatched by the orchestrator for specialized tasks:
  - RESEARCH & EXPLORE: Deep analysis of repository structure, architecture, and large context files.
  - IMPLEMENT: Generate clean, idiomatic code and documentation.
  - REVIEW: Scrutinize code changes and provide clear feedback with file:line citations.

  Always return concise, structured findings to the orchestrator.

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

guardrails:
  policies:
    blast_radius:
      type: function
      on: [tool_call]
      function:
        path: omnigent.inner.nessie.policies.blast_radius
        arguments:
          gate_pushes: false
